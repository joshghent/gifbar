[package]
name = "gifbar"
version = "2.0.1"
description = "A menu bar app for searching, copying and sharing GIFs"
authors = ["Josh Ghent"]
license = "MIT"
edition = "2021"

[lib]
name = "gifbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
# rustls rather than the platform TLS stack, so the Linux build does not need
# libssl-dev at package time.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Native clipboard access. The cross-platform crates only accept decoded RGBA,
# which loses GIF animation, so each platform gets its own pasteboard code.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = "3"
