name: Deploy worker

# Deploys the GIF proxy (worker/) to Cloudflare.
#
# Only the code deploys from here. The GIPHY and Tenor keys are set once with
# `wrangler secret put` and live solely in Cloudflare — mirroring them into
# GitHub secrets would widen the blast radius for keys that change maybe once
# a year, and the whole point of the worker is to shrink where they exist.

on:
  push:
    branches: [master]
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
        working-directory: worker

      # The release pipeline gates on this worker being healthy, so a broken
      # deploy blocks releases. Cheap to run the tests first.
      - run: npm test
        working-directory: worker

      # Uses the wrangler pinned in worker/package-lock.json rather than a
      # floating one from an action, so CI deploys the version tested above.
      - run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify the deployed worker answers
        env:
          BASE: ${{ vars.VITE_GIF_API_BASE }}
        run: |
          set -euo pipefail
          base="${BASE:-https://gifbar-api.ghent.workers.dev}"
          base="${base%/}"

          health=$(curl -fsS --retry 5 --retry-all-errors --max-time 20 "$base/health")
          echo "health: $health"

          # /health reports a boolean per provider, so a missing or misnamed
          # secret is visible here rather than only as a thinner grid.
          for provider in giphy tenor; do
            if [ "$(echo "$health" | jq -r ".providers.$provider")" != "true" ]; then
              echo "::warning::No ${provider} key configured — that provider will be skipped. Set it in the Cloudflare dashboard under the worker's Settings → Variables and Secrets."
            fi
          done

          # A provider with no key is skipped rather than erroring, so /health
          # alone returns ok on a worker that cannot serve a single GIF.
          count=$(curl -fsS --max-time 20 "$base/trending?limit=4" | jq '.gifs | length')
          echo "trending returned $count gifs"
          if [ "$count" -eq 0 ]; then
            echo "::error::Worker is up but returned no GIFs — neither provider key is working."
            exit 1
          fi
