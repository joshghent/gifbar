name: Release

# The single release path.
#
# release-please watches conventional commits on master and maintains a
# release PR. Merging that PR is what cuts a release: release-please then
# creates the tag and a DRAFT GitHub release, the matrix builds installers
# for every platform and uploads them to that draft, and only once every
# leg has succeeded does the draft get published.
#
# Building into a draft is deliberate. A published GitHub release is
# immutable, so uploading assets to one that already went live is what
# produced the "immutable release" failures this replaces.

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_id: ${{ steps.draft.outputs.id || steps.release.outputs.id }}
      tag_name: ${{ steps.draft.outputs.tag_name || steps.release.outputs.tag_name }}
      release_sha: ${{ steps.draft.outputs.sha || steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      # Draft releases have no published tag yet. Reuse the current version's
      # draft on retries instead of relying on release_created (a one-time event).
      - name: Find unfinished release
        uses: actions/github-script@v7
        id: draft
        with:
          script: |
            const findDraft = require('./.github/scripts/find-release-draft.cjs');
            await findDraft({ github, context, core });

      - uses: googleapis/release-please-action@v4
        if: steps.draft.outputs.id == ''
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  build:
    needs: release-please
    if: needs.release-please.outputs.release_id != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-15-intel
            rust-target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - name: GIF proxy worker is reachable
        shell: bash
        env:
          BASE: ${{ vars.VITE_GIF_API_BASE }}
        run: |
          set -euo pipefail
          # Must match the fallback in src/lib/gif-api.js.
          base="${BASE:-https://gifbar-api.ghent.workers.dev}"
          base="${base%/}"
          echo "Checking $base/health"
          code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 20 --retry 3 "$base/health" || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::$base/health returned $code. Deploy the worker (see worker/README.md) and set the VITE_GIF_API_BASE repository variable before releasing."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - run: npm ci

      # createUpdaterArtifacts is false in the committed config so that CI and
      # Dependabot can build without the signing key. Updater artifacts need it
      # on, and only the release build produces them. Patching the file beats
      # passing --config: the CLI resolves that path relative to the working
      # directory, which differs from where the config lives, and the mistake
      # would only ever surface during a real release.
      - name: Enable updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          jq '.bundle.createUpdaterArtifacts = true' src-tauri/tauri.conf.json > conf.tmp
          mv conf.tmp src-tauri/tauri.conf.json
          jq -r '"createUpdaterArtifacts=\(.bundle.createUpdaterArtifacts)"' src-tauri/tauri.conf.json

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GIF_API_BASE: ${{ vars.VITE_GIF_API_BASE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release-please.outputs.release_id }}
          tagName: ${{ needs.release-please.outputs.tag_name }}
          retryAttempts: 3
          releaseName: GifBar ${{ needs.release-please.outputs.tag_name }}
          releaseDraft: true
          includeUpdaterJson: true

  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify installers are attached before publishing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "Attached assets:"
          echo "$assets"

          # GitHub always adds a source zip and tarball, so "the release has
          # assets" is not enough — shipping only those is exactly the bug this
          # pipeline exists to fix. Require a real installer per platform.
          for ext in dmg AppImage deb exe; do
            echo "$assets" | grep -q "\.${ext}$" || {
              echo "::error::No .${ext} attached to $TAG — refusing to publish."
              exit 1
            }
          done

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --draft=false --latest

  release-pr:
    needs: [release-please, publish]
    # A draft has no published tag for release-please to use as its baseline.
    # Do not propose the next version until the current one is published.
    if: >-
      !cancelled() && needs.release-please.result == 'success' &&
      (needs.publish.result == 'success' || needs.release-please.outputs.release_id == '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
